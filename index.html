<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Royal Store - Store & Showroom Locator</title>
  <meta name="description" content="Explore Royal Store flagship showrooms and dealer locations across Bangladesh. Get addresses, contact numbers, and turn-by-turn directions.">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Leaflet CSS (100% Free Open-Source Map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- ==========================================
         SIDEBAR: Search, Filters & Store List
         ========================================== -->
    <aside class="sidebar" id="sidebar">
      <!-- Header -->
      <div class="sidebar-header">
        <div class="brand-row">
          <div class="brand-info">
            <div class="brand-icon">
              <i class="fa-solid fa-crown"></i>
            </div>
            <div class="brand-text">
              <h1>Royal Store</h1>
              <p>Store & Dealer Locator</p>
            </div>
          </div>
          <span class="total-badge" id="totalShowroomsBadge">30 Showrooms</span>
        </div>
      </div>

      <!-- Search & Filters Section -->
      <div class="search-filter-section">
        <!-- Search Input -->
        <div class="search-box-wrapper">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search by name, district, area or phone..." 
            autocomplete="off"
          />
          <button id="clearSearch" class="clear-search-btn" title="Clear search">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Division & Geolocation Filter Row -->
        <div class="filter-row">
          <select id="divisionFilter" class="custom-select">
            <option value="all">All Bangladesh (All Divisions)</option>
          </select>
          <button id="nearMeBtn" class="near-me-btn" title="Find nearest showrooms from your location">
            <i class="fa-solid fa-location-crosshairs"></i> Near Me
          </button>
        </div>

        <!-- Category Pills -->
        <div class="category-pills">
          <button class="category-pill active" data-category="all">
            <i class="fa-solid fa-list-check"></i> All Stores
          </button>
          <button class="category-pill" data-category="flagship">
            <i class="fa-solid fa-star"></i> Flagship
          </button>
          <button class="category-pill" data-category="dealer">
            <i class="fa-solid fa-store"></i> Dealers
          </button>
          <button class="category-pill" data-category="corporate">
            <i class="fa-solid fa-building"></i> Head Office
          </button>
        </div>

        <!-- Radius Slider Box (Activates on Near Me) -->
        <div class="radius-container" id="radiusContainer">
          <div class="radius-header">
            <span><i class="fa-solid fa-bullseye"></i> Search Radius:</span>
            <span id="radiusValue">100 km</span>
          </div>
          <input type="range" id="radiusSlider" class="radius-slider" min="5" max="150" step="5" value="100">
        </div>
      </div>

      <!-- Results Info Bar -->
      <div class="results-info-bar">
        <span class="results-count" id="resultsCount">Loading showrooms...</span>
        <select id="sortSelect" class="sort-select">
          <option value="default">Default Order</option>
          <option value="distance">Nearest Distance</option>
          <option value="name-asc">Name (A to Z)</option>
          <option value="name-desc">Name (Z to A)</option>
        </select>
      </div>

      <!-- Store Cards List -->
      <div class="store-list-container" id="storeList">
        <!-- Rendered by js/app.js -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <i class="fa-solid fa-location-dot"></i>
        <h3>No Showrooms Found</h3>
        <p>Try adjusting your search terms or choosing a different division from the dropdown.</p>
      </div>

      <!-- Sidebar Footer Credits -->
      <footer class="sidebar-footer">
        <span>Developed by <a href="https://www.royaltechbd.com/" target="_blank" rel="noopener">Royal Technologies</a></span>
      </footer>
    </aside>

    <!-- Sidebar Collapse / Expand Toggle Button -->
    <button id="sidebarToggleBtn" class="sidebar-collapse-btn" title="Hide sidebar" aria-label="Toggle sidebar">
      <i class="fa-solid fa-chevron-left" id="sidebarToggleIcon"></i>
    </button>

    <!-- ==========================================
         MAP VIEWPORT: Leaflet Interactive Map
         ========================================== -->
    <main class="map-viewport">
      <div id="map"></div>

      <!-- Floating Controls on Map -->
      <div class="map-floating-controls">
        <button id="resetViewBtn" class="map-control-btn" title="Fit Bangladesh View">
          <i class="fa-solid fa-globe"></i>
        </button>
        <button id="locateMeMapBtn" class="map-control-btn" title="My Current Location">
          <i class="fa-solid fa-crosshairs"></i>
        </button>
        <button id="fullscreenBtn" class="map-control-btn" title="Toggle Fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>

      <!-- Mobile Toggle Button -->
      <button id="mobileToggleBtn" class="mobile-toggle-btn">
        <i class="fa-solid fa-list-ul"></i> View Showrooms List
      </button>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Store Data & Application Logic -->
  <script src="js/stores-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
